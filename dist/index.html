<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Rustcord</title>
<style>
  :root { color-scheme: dark; }
  html, body { margin: 0; height: 100%; background: #1a1a1e; color: #dbdee1;
    font: 15px/1.4 "gg sans", "Segoe UI", system-ui, sans-serif; }
  body { display: grid; place-items: center; -webkit-user-select: none; user-select: none; }
  .box { text-align: center; max-width: 360px; padding: 0 16px; }
  h1 { font-size: 20px; font-weight: 600; margin: 0 0 8px; color: #f2f3f5; }
  p { margin: 0 0 20px; color: #949ba4; }
  button { background: #5865f2; color: #fff; border: 0; border-radius: 8px; padding: 10px 20px;
    font: inherit; font-weight: 500; cursor: pointer; }
  button:hover { background: #4752c4; }
  .spin { width: 28px; height: 28px; margin: 0 auto 20px; border: 3px solid #3f4147;
    border-top-color: #949ba4; border-radius: 50%; animation: s 1s linear infinite; }
  @keyframes s { to { transform: rotate(360deg); } }
</style>
</head>
<body>
<div class="box">
  <div class="spin"></div>
  <h1 id="t">Connecting…</h1>
  <p id="d">Waiting for an internet connection. Rustcord will reconnect automatically.</p>
  <button id="r">Retry now</button>
</div>
<script>
  const tr = navigator.language.toLowerCase().startsWith('tr');
  if (tr) {
    document.getElementById('t').textContent = 'Bağlanılıyor…';
    document.getElementById('d').textContent = 'İnternet bağlantısı bekleniyor. Rustcord otomatik olarak yeniden bağlanacak.';
    document.getElementById('r').textContent = 'Şimdi dene';
  }
  const target = new URLSearchParams(location.search).get('to') || 'https://discord.com/app';
  const safe = /^https:\/\/([a-z0-9-]+\.)?discord\.com\//i.test(target) ? target : 'https://discord.com/app';
  const go = () => { location.href = safe; };
  document.getElementById('r').onclick = go;
  addEventListener('online', go);
  setInterval(() => { if (navigator.onLine) go(); }, 5000);
</script>
</body>
</html>
