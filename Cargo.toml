[package]
name = "rustcord"
version = "0.1.0"
edition = "2024"
description = "Lightweight Rust + WebView2 desktop shell for the official Discord web client (unofficial)"
license-file = "LICENSE.md"
repository = "https://github.com/Venzyx/Rustcord"
publish = false

[dependencies]
base64 = "0.22"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = ["tray-icon", "image-png"] }
tauri-plugin-autostart = "2"
tauri-plugin-single-instance = "2"
tauri-plugin-window-state = "2"
tauri-winrt-notification = "0.8.1"
tokio = { version = "1", features = ["net", "io-util", "time", "sync", "rt", "macros"] }
url = "2"
webview2-com = "0.39"
windows = { version = "0.62", features = ["Win32_Foundation", "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging", "Win32_Globalization", "Win32_System_Diagnostics_ToolHelp", "Win32_System_Threading"] }
windows-core = "0.62"
windows-registry = "0.6"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true
